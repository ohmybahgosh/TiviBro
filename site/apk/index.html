<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TiviBro for Android</title><meta name="robots" content="noindex"><link rel="icon" href="/img/icon-32.png">
<style>html,body{margin:0;height:100%;background:#0b0e1a;color:#e8ecf8;font:17px/1.5 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}main{max-width:440px;padding:24px}a{color:#33e1ff}small{color:#7c85a3}</style>
</head><body><main>
<p id="m">Finding the newest TiviBro app for Android…</p>
<p><small>Or pick one yourself on the <a href="https://github.com/ohmybahgosh/TiviBro/releases">releases page</a>.</small></p>
</main>
<script>
/* The newest release that carries the phone app (test builds included), straight to its APK.  The
   releases page if GitHub doesn't answer. */
(function () {
  var REL = 'https://github.com/ohmybahgosh/TiviBro/releases', m = document.getElementById('m');
  function fallback() { m.innerHTML = 'Taking you to the <a href="' + REL + '">releases page</a>…'; location.replace(REL); }
  var x = new XMLHttpRequest();
  x.open('GET', 'https://api.github.com/repos/ohmybahgosh/TiviBro/releases?per_page=20');
  x.timeout = 8000;
  x.onload = function () {
    try {
      var list = JSON.parse(x.responseText);
      for (var i = 0; i < list.length; i++) {
        if (list[i].draft) continue;
        var a = (list[i].assets || []).filter(function (f) { return /\.apk$/i.test(f.name); })[0];
        if (a) { m.innerHTML = 'Downloading <b>' + a.name + '</b> (' + list[i].tag_name + ')…<br><small>On your phone, open it from your downloads to install.</small>'; location.replace(a.browser_download_url); return; }
      }
    } catch (e) {}
    fallback();
  };
  x.onerror = x.ontimeout = fallback;
  x.send();
})();
</script>
</body></html>
