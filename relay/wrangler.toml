# TiviBro report relay (see worker.js).  Deploy: npx wrangler deploy  (from this folder)
# The GitHub token is a secret, never in this file:  npx wrangler secret put GITHUB_TOKEN
name = "tivibro-report"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
REPO = "ohmybahgosh/TiviBro"

[[kv_namespaces]]
binding = "RATE"
id = "2f76b8ab389f45519c6fa4d7edc86506"

[observability.logs]
enabled = true
invocation_logs = false

# Install numbers and the GitHub history for tivibro.app/stats (see worker.js).  The key is a secret:
# npx wrangler secret put STATS_KEY
[[kv_namespaces]]
binding = "STATS"
id = "0939c9221424485ab6af6be00b1ee886"
