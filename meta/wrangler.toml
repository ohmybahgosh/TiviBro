# TiviBro metadata relay (see worker.js).  Deploy: npx wrangler deploy  (from this folder)
# TheTVDB's API key is a secret, never in this file:  npx wrangler secret put TVDB_KEY
name = "tivibro-meta"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = false

# Streaming Top 10s (top10.js): FlixPatrol's API key is a secret, never in this file:
#   npx wrangler secret put FLIXPATROL_KEY
# and each country's charts are kept in this KV namespace (npx wrangler kv namespace create TOP10).
[[kv_namespaces]]
binding = "TOP10"
id = "fbfc367fc247449c90d6d130a581c278"
