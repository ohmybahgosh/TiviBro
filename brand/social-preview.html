<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0B0E1A;font-family:'Inter','Inter Display',sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 78% 40%,rgba(91,140,255,.28),transparent 60%),radial-gradient(600px 400px at 8% 100%,rgba(51,225,255,.13),transparent 65%),#0B0E1A}
.tv{position:absolute;left:640px;top:96px;width:840px;transform:perspective(1600px) rotateY(-16deg) rotateX(3deg);transform-origin:left center;border-radius:18px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(120,150,255,.25),0 0 90px rgba(91,140,255,.25)}
.tv img{display:block;width:100%}
.tv:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,14,26,.0) 55%,rgba(11,14,26,.55))}
.fade{position:absolute;left:0;top:0;width:820px;height:640px;background:linear-gradient(90deg,#0B0E1A 74%,rgba(11,14,26,0))}
.txt{position:absolute;left:84px;top:150px;width:560px}
.wm{height:104px;display:block;margin-left:-6px}
h1{color:#E8ECF8;font-size:46px;line-height:1.12;font-weight:700;letter-spacing:-.8px;margin:34px 0 0}
h1 span{background:linear-gradient(90deg,#5B8CFF,#33E1FF);-webkit-background-clip:text;color:transparent}
p{color:#9AA4C4;font-size:22px;margin:18px 0 0;line-height:1.45}
.chips{margin-top:30px;display:flex;gap:10px}
.chip{color:#cfd8ff;font-size:17px;font-weight:600;padding:9px 16px;border-radius:999px;background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.35)}
.url{position:absolute;left:84px;bottom:44px;color:#6f7aa0;font-size:18px;font-weight:600;letter-spacing:.4px}
</style></head><body><div class="bg"></div>
<div class="tv"><img src="../docs/screenshots/tv-guide.png"></div><div class="fade"></div>
<div class="txt"><img class="wm" src="../site/img/wordmark.png">
<h1>The IPTV player<br><span>LG TVs never got.</span></h1>
<p>Free, guide-first, and set up from your phone.</p>
<div class="chips"><div class="chip">TV guide</div><div class="chip">Catch-up</div><div class="chip">Movies &amp; shows</div><div class="chip">Sports &amp; PPV</div></div></div>
<div class="url">tivibro.app</div>
</body></html>
