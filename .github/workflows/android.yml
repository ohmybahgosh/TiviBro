name: Android app

# The TiviBro phone app (android/).  Tests it against the TV's real helper code (tests/android/fake-tv.js
# runs service/companion.js), builds the APKs and the Google Play bundle (.aab), and on a TiviBro release adds
# the APK to that release and sends the same build to the Google Play test (when PLAY_SERVICE_ACCOUNT_JSON is set).
on:
  push:
    branches: [main]
    paths: ['android/**', 'service/companion.js', 'tests/android/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'service/companion.js', 'tests/android/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test and build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4, pinned
        with:
          gradle-version: '8.11.1'

      - name: Version
        id: v
        run: |
          # A release: its tag (0.6.0-alpha.142).  Otherwise the next version, marked dev (0.6.0-dev.231).  The APK and the
          # Play bundle of one run share the name and the build number (the run number), so a release is the same
          # release on GitHub and on Google Play.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then n="${GITHUB_REF_NAME#v}"; else n="$(node -p 'require("./package.json").version')-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$n" >> "$GITHUB_OUTPUT"

      - name: Unit tests, and pairing with the TV's real helper
        working-directory: android
        run: |
          node ../tests/android/fake-tv.js > /tmp/fake-tv.txt &
          for i in $(seq 1 20); do [ -s /tmp/fake-tv.txt ] && break; sleep 0.5; done
          echo "Stand-in TV: $(cut -d: -f1,2 /tmp/fake-tv.txt)"
          TB_FAKE_TV="$(head -1 /tmp/fake-tv.txt)" gradle --no-daemon --stacktrace testDebugUnitTest
          grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml

      - name: Build
        working-directory: android
        env:
          TB_VERSION_NAME: ${{ steps.v.outputs.name }}
          TB_VERSION_CODE: ${{ github.run_number }}
          # The release key (only on this repository's own builds; pull requests from forks get the test key).
          TB_KEYSTORE_B64: ${{ secrets.TB_KEYSTORE_B64 }}
          TB_KEYSTORE_PASS: ${{ secrets.TB_KEYSTORE_PASS }}
          TB_KEY_ALIAS: ${{ secrets.TB_KEY_ALIAS }}
          TB_KEY_PASS: ${{ secrets.TB_KEY_PASS }}
        run: |
          if [ -n "$TB_KEYSTORE_B64" ]; then printf '%s' "$TB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export TB_KEYSTORE="$RUNNER_TEMP/release.jks"; echo "Signing with the release key"; else echo "No release key: signing with the test key"; fi
          gradle --no-daemon assembleRelease assembleDebug
          if [ -n "${TB_KEYSTORE:-}" ]; then "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -i "SHA-256" | head -1 || true; fi
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk "../dist-apk/tivibro-phone-${{ steps.v.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-apk/tivibro-phone-${{ steps.v.outputs.name }}-debug.apk"
          # The Google Play build (an app bundle, signed with the same key as the upload key): no updating in
          # place from GitHub, and no permission to install apps (app/build.gradle.kts, TB_STORE).
          TB_STORE=play gradle --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "../dist-apk/tivibro-phone-${{ steps.v.outputs.name }}-play.aab"
          rm -f "${TB_KEYSTORE:-/nonexistent}"
          ls -la ../dist-apk

      - name: Keep the APKs
        uses: actions/upload-artifact@v7
        with:
          name: tivibro-phone-${{ steps.v.outputs.name }}
          path: |
            dist-apk/*.apk
            dist-apk/*.aab
          retention-days: 30

      - name: Add the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" "dist-apk/tivibro-phone-${{ steps.v.outputs.name }}.apk" --clobber

      # The same release on Google Play: the bundle goes to the closed test ("alpha" track), with "What's new" from
      # the changelog.  Needs a service account with release rights in Play Console, its JSON key in the secret
      # PLAY_SERVICE_ACCOUNT_JSON.  Without it, upload dist-apk/*-play.aab from this run's artifact by hand.
      - name: What's new, for Google Play
        if: startsWith(github.ref, 'refs/tags/v')
        id: play
        env:
          HAS_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "send=$HAS_KEY" >> "$GITHUB_OUTPUT"
          mkdir -p whatsnew
          node -e '
            const fs = require("fs"), v = process.argv[1], m = v.match(/alpha\.(\d+)$/);
            const md = fs.readFileSync("CHANGELOG.md", "utf8");
            let part = "";
            if (m) { const i = md.indexOf("### New in alpha " + m[1]); if (i >= 0) { part = md.slice(i).split("\n").slice(1).join("\n"); part = part.slice(0, part.search(/\n##/) >>> 0); } }
            let t = part.split("\n").filter(l => /^- /.test(l)).map(l => "• " + (l.match(/\*\*(.+?)\*\*/) || [, l.slice(2)])[1]).join("\n");
            if (!t) t = "TiviBro " + v + ".  What changed: tivibro.app/changelog/";
            if (t.length > 490) t = t.slice(0, t.lastIndexOf("\n", 470)) + "\n• More: tivibro.app/changelog/";
            fs.writeFileSync("whatsnew/whatsnew-en-US", t);
            console.log(t);
          ' "${{ steps.v.outputs.name }}"
          [ "$HAS_KEY" = true ] || echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON: upload tivibro-phone-${{ steps.v.outputs.name }}-play.aab to Google Play by hand"

      - name: Send it to the Google Play test
        if: startsWith(github.ref, 'refs/tags/v') && steps.play.outputs.send == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5   # v1, pinned: it holds the Play upload key
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tivibro.phone
          releaseFiles: dist-apk/tivibro-phone-${{ steps.v.outputs.name }}-play.aab
          releaseName: ${{ steps.v.outputs.name }}
          track: alpha
          status: completed
          whatsNewDirectory: whatsnew

  screens:
    name: Run it on an emulator
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          path: apk
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Stand-in TV
        run: |
          node tests/android/fake-tv.js > /tmp/fake-tv.txt &
          for i in $(seq 1 20); do [ -s /tmp/fake-tv.txt ] && break; sleep 0.5; done
          echo "TV=$(head -1 /tmp/fake-tv.txt)" >> "$GITHUB_ENV"

      - name: Pair, open the editor, take screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2, pinned: third-party actions run with our secrets
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tests/android/ui-shots.sh "$(ls apk/*.apk | grep -v debug | head -1)" shots "$TV"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tivibro-phone-screens
          path: |
            shots/*.png
            shots/ui.xml
            shots/logcat.txt
          retention-days: 30
