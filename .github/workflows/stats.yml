name: Stats

# Every day: GitHub's numbers for TiviBro (traffic, stars, forks, release downloads) to the relay, which
# keeps them past GitHub's 14 days, for the dashboard at tivibro.app/stats.  See scripts/stats/collect.js.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Collect and store
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TB_STATS_TOKEN: ${{ secrets.TB_STATS_TOKEN }}
          TB_STATS_KEY: ${{ secrets.TB_STATS_KEY }}
        run: node scripts/stats/collect.js
