name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the webOS CLI
        run: npm ci

      - name: Lint
        run: bash scripts/lint.sh

      - name: Unit tests
        run: npm test

      - name: Build the IPK
        run: bash scripts/build.sh

      - name: Keep the test build
        uses: actions/upload-artifact@v7
        with:
          name: tivibro-ipk-${{ github.sha }}
          path: dist/*.ipk
          retention-days: 14
