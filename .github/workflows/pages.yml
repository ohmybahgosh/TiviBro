# tivibro.app: the website in site/, plus the demo videos from docs/media, and the channel logo index
# (tivibro.app/logos/, addresses only, no images: scripts/logos/build-index.js), published with GitHub Pages.
# Runs every Monday too, so the logo index follows the logo projects.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'README.md', 'docs/**', 'app/js/**', 'service/*.js', 'android/app/src/main/java/**', 'CHANGELOG.md', 'CONTRIBUTING.md', 'AGENTS.md', 'scripts/gen-ai-context.js', 'docs/USER-GUIDE.md', 'scripts/gen-viewer.js', 'docs/media/guide.mp4', 'docs/media/live-edit.mp4', '.github/workflows/pages.yml', 'scripts/logos/**', 'scripts/tv/install.sh', 'app/js/tidy.js', 'app/js/names.js']
  workflow_run:                 # after a release, so tivibro.app/repo has the new version
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false      # let a running deploy finish; the next one waits its turn
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp docs/media/guide.mp4 docs/media/live-edit.mp4 _site/media/
      - name: Short addresses for the Homebrew Channel and the installer
        # tivibro.app/repo, /testing and /install serve the files on the homebrew branch as they are
        # (no redirect: the Homebrew Channel and curl read them straight).  .json and .sh copies too.
        continue-on-error: true
        run: |
          git fetch -q --depth 1 origin homebrew
          git show origin/homebrew:repo.json > _site/repo
          git show origin/homebrew:repo-testing.json > _site/testing
          git show origin/homebrew:install.sh > _site/install
          cp _site/repo _site/repo.json; cp _site/testing _site/repo-testing.json; cp _site/install _site/install.sh
          head -c 300 _site/repo; echo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Knowledge base for AI assistants (tivibro.app/ai/tivibro-for-ai.md)
        run: node scripts/gen-ai-context.js _site/ai/tivibro-for-ai.md
      - name: Screenshot viewer list (tivibro.app/view)
        run: node scripts/gen-viewer.js _site/view/shots.json
      - name: Build the channel logo index
        continue-on-error: true       # the site still goes out if a logo project is down; TVs keep last week's copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/logos/build-index.js _site/logos
      - name: List the site
        run: |
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
