# tivibro.app: the website in site/, plus the demo videos from docs/media, and the channel logo index
# (tivibro.app/logos/, addresses only, no images: scripts/logos/build-index.js), published with GitHub Pages.
# Runs every Monday too, so the logo index follows the logo projects.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/media/guide.mp4', 'docs/media/live-edit.mp4', '.github/workflows/pages.yml', 'scripts/logos/**', 'app/js/tidy.js', 'app/js/names.js']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false      # let a running deploy finish; the next one waits its turn
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp docs/media/guide.mp4 docs/media/live-edit.mp4 _site/media/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the channel logo index
        continue-on-error: true       # the site still goes out if a logo project is down; TVs keep last week's copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/logos/build-index.js _site/logos
      - name: List the site
        run: |
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
