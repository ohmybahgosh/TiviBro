name: Release

# Push a tag like v0.6.0 (bash scripts/release.sh does it) to publish a release.
# Tags with a dash, like v0.6.0-beta.1, are marked as pre-releases.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, for example v0.6.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the webOS CLI
        run: npm ci

      - name: Check the tag matches the app version
        run: |
          APP_VERSION="$(node -p "require('./app/appinfo.json').version")"
          if [ "${TAG#v}" != "$APP_VERSION" ] && [ "${TAG#v}" != "${APP_VERSION}-${TAG#*-}" ]; then
            echo "::error::Tag $TAG does not match app/appinfo.json version $APP_VERSION"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Lint
        run: bash scripts/lint.sh

      - name: Unit tests
        run: npm test

      - name: Stamp the version into the app
        # The app shows and compares the full tag (0.6.0-alpha.5).  webOS needs three numbers, unique per
        # build so the Homebrew Channel sees updates: test builds sort below their release (0.5.10005).
        run: |
          sed -i "s/^var TIVIBRO_VERSION = .*/var TIVIBRO_VERSION = '${TAG#v}';/" app/js/log.js && grep -n "TIVIBRO_VERSION = " app/js/log.js
          PKG_VERSION="$(node scripts/pkg-version.js "${TAG#v}")"
          node -e 'for (const f of ["app/appinfo.json", "service/package.json"]) { const j = require("./" + f); j.version = process.argv[1]; require("fs").writeFileSync(f, JSON.stringify(j, null, 2) + "\n"); }' "$PKG_VERSION"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "Package version $PKG_VERSION"

      - name: Build the IPK
        run: bash scripts/build.sh

      - name: On-TV installer
        run: cp scripts/tv/install.sh dist/install.sh

      - name: Homebrew Channel manifest
        run: node scripts/gen-manifest.js "dist/app.tivibro.tv_${PKG_VERSION}_all.ipk" dist "$GITHUB_REPOSITORY" "$TAG"

      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release-notes.js "${TAG#v}" > dist/notes.md
          {
            RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/homebrew"
            case "$TAG" in *-*) echo; echo "> **Test build.**  Expect rough edges, and keep a backup.  The Homebrew Channel shows it as version $PKG_VERSION.";; esac
            echo
            echo '<details><summary>Install</summary>'
            echo
            echo '- **Homebrew Channel:** in its Settings, add the repository `https://tivibro.app/repo` (or `https://tivibro.app/testing` for test builds as they come out).  The long form, `'"$RAW"'/repo.json`, works too'
            echo '- **Developer Mode:** `ares-install app.tivibro.tv_'"$PKG_VERSION"'_all.ipk`'
            echo '- **Rooted TV, over SSH or Telnet:** `curl -fsSL https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/install.sh | sh -s -- --tag '"$TAG"'`'
            echo '- **From inside TiviBro (rooted TV with the Homebrew Channel):** Settings > Updates and about > Check for updates'
            echo
            echo "SHA-256 of the IPK: \`$(sha256sum dist/*.ipk | cut -d' ' -f1)\`"
            echo
            echo '</details>'
          } >> dist/notes.md
          cat dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipk dist/*.manifest.json dist/install.sh --clobber
            gh release edit "$TAG" --notes-file dist/notes.md $PRE
          else
            gh release create "$TAG" dist/*.ipk dist/*.manifest.json dist/install.sh \
              --title "TiviBro ${TAG#v}" --notes-file dist/notes.md --verify-tag $PRE
          fi

      - name: Update the Homebrew Channel repository (homebrew branch)
        # Served as https://raw.githubusercontent.com/<repo>/homebrew/repo.json, which TVs can fetch.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          if git clone -q --depth 1 --branch homebrew "$URL" hb 2>/dev/null; then :; else
            git init -q hb && git -C hb checkout -q --orphan homebrew && git -C hb remote add origin "$URL"
            printf '# TiviBro for the Homebrew Channel\n\nAdd one of these in the Homebrew Channel settings:\n\n- `https://raw.githubusercontent.com/%s/homebrew/repo.json`: releases\n- `https://raw.githubusercontent.com/%s/homebrew/repo-testing.json`: every build, including test builds\n\nOn a rooted TV, over SSH: `curl -fsSL https://raw.githubusercontent.com/%s/homebrew/install.sh | sh`\n\nWritten by the Release workflow; do not edit by hand.\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > hb/README.md
          fi
          node scripts/update-homebrew-repo.js dist/homebrew-entry.json hb dist/install.sh
          cd hb && git add -A
          if git diff --cached --quiet; then echo "Repository files unchanged"; else git commit -q -m "Homebrew repository: $TAG" && git push -q origin homebrew; fi
