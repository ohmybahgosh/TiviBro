name: Docs, wiki or website
description: Something in the README, user guide, wiki or tivibro.app is wrong, unclear or missing.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: A link, or the page and section.
      placeholder: https://github.com/ohmybahgosh/TiviBro/wiki/Installing
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
